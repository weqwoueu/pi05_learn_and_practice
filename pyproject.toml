[project]
name = "vla-interview-practice"
version = "0.1.0"
description = "Small CPU PyTorch exercises for VLA interview preparation"
requires-python = ">=3.11,<3.12"
dependencies = [
    "torch>=2.6,<3",
    "numpy>=2,<3",
    "pytest>=8,<10",
    "matplotlib>=3.9,<4",
    "einops>=0.8,<1",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"